<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You - YaadTrip</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background: #0f0f0f; color: #fff; text-align: center; padding: 60px 20px; }
    h1 { color: #ffd700; margin-bottom: 20px; }
    .tracking { font-size: 2.5rem; font-weight: bold; color: #ffd700; margin: 30px 0; padding: 15px; background: rgba(255,215,0,0.1); border-radius: 10px; }
    .btn {
      background: #ffd700;
      color: #000;
      padding: 15px 40px;
      font-size: 1.2rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 20px 10px;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover { background: #e6c200; }
  </style>
</head>
<body>
  <h1>Payment Successful!</h1>
  <p>Your booking is confirmed. Thank you!</p>
  <p class="tracking">Tracking Code: <span id="tracking-code">Loading...</span></p>
  <p>We'll contact you via WhatsApp soon.</p>
  <a href="/tracking.html" class="btn">Track Your Booking</a>
  <a href="/" class="btn">Back to Home</a>

  <script>
    const trackingCode = localStorage.getItem('trackingCode') || 'N/A';
    document.getElementById('tracking-code').textContent = trackingCode;
    localStorage.removeItem('trackingCode');
  </script>
</body>
</html>
